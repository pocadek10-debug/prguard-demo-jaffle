version: 2

models:
  - name: dim_customers
    description: Customer dimension used by the customer-facing reports.
    columns:
      - name: customer_id
        description: Primary key.
        tests:
          - unique
          - not_null
      - name: first_name
      - name: last_name
      - name: first_order
      - name: most_recent_order
      - name: number_of_orders

  - name: fct_orders
    description: Order fact table.
    columns:
      - name: order_id
        description: Primary key.
        tests:
          - unique
          - not_null
      - name: customer_id
      - name: order_date
      - name: status
      - name: amount

  - name: fct_revenue
    description: Revenue at order-payment grain, used by the exec dashboard.
    columns:
      - name: order_id
        tests:
          - not_null
      - name: customer_id
      - name: order_date
      - name: payment_method
        description: How the customer paid. Sliced by the exec dashboard.
      - name: revenue_amount

  - name: customer_ltv
    description: Lifetime value per customer.
    columns:
      - name: customer_id
      - name: first_name
      - name: last_name
      - name: lifetime_value

  - name: monthly_revenue
    description: Revenue by month and payment method.
    columns:
      - name: revenue_month
      - name: payment_method
      - name: total_revenue
